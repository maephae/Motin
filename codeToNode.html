  const cancel = () => rerenderCard(scopeName);
  input.addEventListener('blur', commit, { once: true });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    else if (e.key === 'Escape') { e.preventDefault(); input.removeEventListener('blur', commit); cancel(); }
  });
}

let elementsEditorCtx = null;
function openElementsEditor(scopeName, idx) {
  const scope = appState.scopes.find(s => s.name === scopeName);
  if (!scope) return;
  const thing = scope.things[idx];
  const current = (editorState.customElements.get(scopeName).get(idx)) || thing._elements || [thing.name];
  elementsEditorCtx = { scopeName, idx };
  renderElementsEditorModal(current);
}
function renderElementsEditorModal(current) {
  const existing = document.getElementById('elements-modal');
  if (existing) existing.remove();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'elements-modal';
  backdrop.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <h2>Edit Elements</h2>
      <div class="field">
        <label>Current elements (one chip per element)</label>
        <div class="elements-list" id="el-chips"></div>
      </div>
      <div class="field">
        <label>Add an element</label>
        <div class="add-element-row">
          <input type="text" id="el-input" placeholder="e.g. e, r, σ, g₁" />
          <button id="el-add-btn">+ Add</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="secondary" id="el-cancel-btn">Cancel</button>
        <button id="el-save-btn">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  let elements = [...current];
  const chipsEl = backdrop.querySelector('#el-chips');
  const inputEl = backdrop.querySelector('#el-input');
  const renderChips = () => {
    chipsEl.innerHTML = elements.length === 0
      ? '<span style="font-size:10px;color:#93b5c8;font-style:italic">no elements</span>'
      : elements.map((e, i) =>
          `<span class="element-chip">${escapeHtml(e)}<button data-remove="${i}">×</button></span>`
        ).join('');
    chipsEl.querySelectorAll('button[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        elements.splice(parseInt(btn.getAttribute('data-remove'), 10), 1);
        renderChips();
      });
    });
  };
  renderChips();
  const addEl = () => {
    const v = inputEl.value.trim();
    if (!v) return;
    elements.push(v);
    inputEl.value = '';
    renderChips();
    inputEl.focus();
  };
  backdrop.querySelector('#el-add-btn').addEventListener('click', addEl);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addEl(); } });
  backdrop.querySelector('#el-cancel-btn').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#el-save-btn').addEventListener('click', () => {
    if (elementsEditorCtx) {
      setCustomElements(elementsEditorCtx.scopeName, elementsEditorCtx.idx, elements);
    }
    backdrop.remove();
    elementsEditorCtx = null;
  });
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
  inputEl.focus();
}

function analyze(code, sourceName) {
  appState.sourceName = sourceName || 'pasted.py';
  let ast = null;
  let scopes = [];
  let morphisms = [];
  let result = { scopes: [], morphisms: [], callEdges: [] };

  try {
    const tokens = tokenize(code);
    const parser = new Parser(tokens);
    ast = parser.parseModule();
  } catch (e) {
    return { scopes, lattices: [], json: null, error: e instanceof ParseError ? e.message : `Parse error: ${e.message}` };
  }

  try {
    result = extractScopes(ast);
    scopes = result.scopes;
    morphisms = result.morphisms;
  } catch (e) {
    return { scopes, lattices: [], json: null, error: `Extract error: ${e.message}` };
  }

  resetEditorState();
  for (const s of scopes) {
    editorState.scopeOrder.push(s.name);
    initScopeState(s.name);
    editorState.strands.set(s.name, (s.internalEdges || []).map(e => [e[0], e[1]]));
  }
  appState.scopes = scopes;
  appState.morphisms = morphisms;

  const lattices = scopes.map(s => {
    const l = buildLatticeFromScope(s, {
      showArrowsOverride: editorState.showArrows.get(s.name),
      customLabels: editorState.customLabels.get(s.name),
      customElements: editorState.customElements.get(s.name),
      baseEdges: editorState.strands.get(s.name),
      label: editorState.customScopeLabels.get(s.name) || s.name,
      lockRadial: editorState.lockRadial.get(s.name),
    });
    if (l) l._scopeName = s.name;
    return l;
  }).filter(Boolean);

  placeLatticesInWheel(lattices);
  appState.json = emitPsinite(lattices, { includeMorphisms: true, morphisms, sourceName: appState.sourceName });
  return { scopes, lattices, json: appState.json, error: null };
}

function rebuildLattices() {
  const lattices = appState.scopes.map(s => {
    const l = buildLatticeFromScope(s, {
      showArrowsOverride: editorState.showArrows.get(s.name),
      customLabels: editorState.customLabels.get(s.name),
      customElements: editorState.customElements.get(s.name),
      baseEdges: editorState.strands.get(s.name),
      label: editorState.customScopeLabels.get(s.name) || s.name,
      lockRadial: editorState.lockRadial.get(s.name),
    });
    if (l) l._scopeName = s.name;
    return l;
  }).filter(Boolean);
  placeLatticesInWheel(lattices);
  appState.json = emitPsinite(lattices, { includeMorphisms: true, morphisms: appState.morphisms, sourceName: appState.sourceName });
  return lattices;
}

function downloadJson(mode) {
  const lattices = rebuildLattices();
  const includeMorphisms = mode === 'morphisms';
  const json = emitPsinite(lattices, { includeMorphisms, morphisms: appState.morphisms, sourceName: appState.sourceName });
  const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = includeMorphisms ? 'extracted-with-morphisms.psinite' : 'extracted-base.psinite';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const EXAMPLE = `#!/usr/bin/env python3
"""
scaffold.py — turn an ASCII/box-drawing file tree into real files and folders.

Usage:
    python3 scaffold.py TREE_FILE [OUTPUT_DIR] [--dry-run] [--force]
"""

import argparse
import os
import re
import sys
from dataclasses import dataclass, field
from typing import Optional


# Characters that make up the "rail" / indentation prefix of a tree line.
RAIL_CHARS = "│├└─ \\t"


def strip_comment(text: str):
    """Split 'Name.jsx   # some comment' into ('Name.jsx', 'some comment')."""
    m = re.search(r"(?:^|\\s)#\\s?(.*)$", text)
    if not m:
        return text.strip(), None
    return text[: m.start()].rstrip(), (m.group(1).strip() or None)


def parse_line(raw_line: str, line_no: int):
    line = raw_line.rstrip("\\n")
    if not line.strip():
        return None
    return line


def main():
    parser = argparse.ArgumentParser(description="Scaffold from an ASCII tree.")
    parser.add_argument("tree_file")
    parser.add_argument("output_dir", nargs="?", default=".")
    args = parser.parse_args()
    print(f"Reading {args.tree_file} → {args.output_dir}")


if __name__ == "__main__":
    main()
`;
